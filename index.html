<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>হিমেল বনাম বউ — RUN!</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;font-family:Arial,sans-serif}
body{touch-action:none}
@media (orientation:portrait){
 #game:after{content:'📱 ফোনটা Landscape করে খেলুন';position:absolute;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,13,.96);color:#fff;font-size:clamp(20px,6vw,34px);font-weight:900;text-align:center;padding:30px}
 #start,#over{display:none!important}
}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#10182b 0%,#243657 53%,#182019 54%,#0d120e 100%)}
.skyGlow{position:absolute;inset:0;background:radial-gradient(circle at 78% 18%,rgba(255,220,120,.22),transparent 18%),linear-gradient(180deg,transparent 0 45%,rgba(0,0,0,.2) 70%,rgba(0,0,0,.6) 100%)}
.moon{position:absolute;width:70px;height:70px;border-radius:50%;right:12%;top:10%;background:#fff5bf;box-shadow:0 0 45px rgba(255,245,190,.45)}
.city{position:absolute;bottom:31%;left:0;width:200%;height:23%;opacity:.75;background:linear-gradient(90deg,transparent 0 2%,#111827 2% 7%,transparent 7% 10%,#182236 10% 14%,transparent 14% 18%,#101827 18% 24%,transparent 24% 28%,#172135 28% 33%,transparent 33% 37%,#0e1624 37% 43%,transparent 43% 47%,#19243a 47% 52%,transparent 52% 57%,#101827 57% 63%,transparent 63% 68%,#182236 68% 73%,transparent 73% 77%,#101827 77% 84%,transparent 84% 90%,#19243a 90% 96%,transparent 96%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:36%;background:repeating-linear-gradient(110deg,rgba(255,255,255,.025) 0 3px,transparent 3px 70px),linear-gradient(#2c3428,#0b0e0a);border-top:5px solid #4b5546}
.lane{position:absolute;left:0;right:0;bottom:12%;height:7px;background:repeating-linear-gradient(90deg,#e8e8e8 0 75px,transparent 75px 155px);opacity:.35}
#hud{position:absolute;z-index:30;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;color:white;font-weight:900;text-shadow:0 2px 4px #000}
.badge{padding:8px 12px;border-radius:14px;background:rgba(8,10,18,.62);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(7px)}

/* ===== Characters ===== */
.character{position:absolute;z-index:12;bottom:12%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.6))}
#player{left:28%;width:58px;height:104px}
#wife{left:8%;width:58px;height:104px}

/* The uploaded photos are NOT shown as full pictures.
   Only the cropped transparent face PNG is placed over a simple game body. */
.face{
 position:absolute;
 z-index:4;
 overflow:hidden;
 border-radius:50%;
 background:transparent;
}
.face img{display:block;width:100%;height:100%;object-fit:contain}

/* Himel body */
#player .face{top:0;left:14px;width:32px;height:32px}
#player .p-hair{position:absolute;top:1px;left:11px;width:36px;height:18px;background:#25201b;border-radius:18px 18px 5px 5px;z-index:3}
#player .p-body{position:absolute;top:30px;left:8px;width:42px;height:39px;background:#2563eb;border-radius:9px 9px 4px 4px}
#player .p-leg-1,#player .p-leg-2{position:absolute;top:66px;width:11px;height:38px;background:#1e293b;border-radius:5px}
#player .p-leg-1{left:12px}.p-leg-2{left:35px}

/* Wife body */
#wife .face{top:0;left:12px;width:36px;height:36px}
#wife .w-hair{position:absolute;top:-2px;left:7px;width:44px;height:43px;background:#111;border-radius:22px 22px 12px 12px;z-index:2}
#wife .w-dress{position:absolute;top:31px;left:5px;width:48px;height:46px;background:#d90b93;border-radius:13px 13px 5px 5px}
#wife .w-leg-1,#wife .w-leg-2{position:absolute;top:73px;width:10px;height:31px;background:#31b53b;border-radius:5px}
#wife .w-leg-1{left:14px}.w-leg-2{left:34px}

.running .p-leg-1,.running .w-leg-1{animation:runLeg1 .25s infinite alternate ease-in-out}
.running .p-leg-2,.running .w-leg-2{animation:runLeg2 .25s infinite alternate ease-in-out}
@keyframes runLeg1{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
@keyframes runLeg2{from{transform:rotate(25deg)}to{transform:rotate(-25deg)}}

.obstacle{position:absolute;z-index:10;bottom:12%;filter:drop-shadow(0 7px 7px #000)}
.rock{width:45px;height:45px;background:linear-gradient(145deg,#bfc2c7,#555b65 55%,#222);clip-path:polygon(10% 100%,0 55%,25% 10%,63% 0,100% 35%,91% 85%,70% 100%)}
.box{width:45px;height:45px;background:linear-gradient(135deg,#ffb52e,#a84a00);border:4px solid #ffd56b;border-radius:6px}
.barrel{width:40px;height:50px;background:linear-gradient(90deg,#5b140d,#db4b21 35%,#7d1d11 70%,#3a0c09);border:3px solid #ff7a46;border-radius:10px}
.tree{width:24px;height:55px;background:#573319;border-radius:4px}
.tree:before{content:"";position:absolute;width:50px;height:50px;left:-13px;top:-32px;border-radius:50%;background:#1f6a2a;box-shadow:18px -8px #2a8133,-12px -10px #194f22}

#jump{position:absolute;z-index:40;right:25px;bottom:25px;width:80px;height:80px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(20,25,40,.75);color:white;font-size:16px;font-weight:900;box-shadow:0 8px 25px #000}
#start,#over{position:absolute;z-index:60;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.75)}
.panel{width:min(92vw,440px);padding:24px;text-align:center;color:white;border-radius:20px;background:rgba(13,17,27,.95);border:1px solid #59647a}
h1{margin:0 0 10px;font-size:clamp(28px,7vw,42px)}
.sub{opacity:.86;line-height:1.5;margin-bottom:15px}
button.start{border:0;border-radius:999px;padding:12px 28px;font-size:18px;font-weight:900;background:#fff;color:#111;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
 <audio id="startAudio" src="start_audio.mp3" preload="auto"></audio>
 <div class="skyGlow"></div><div class="moon"></div><div class="city"></div>
 <div class="ground"></div><div class="lane"></div>

 <div id="hud">
  <div class="badge">🏃 হিমেল &nbsp; LEVEL <span id="level">1</span></div>
  <div class="badge">⭐ <span id="score">0</span>/5</div>
 </div>

 <!-- Himel: simple body + ONLY cropped face PNG -->
 <div id="player" class="character">
   <div class="p-hair"></div>
   <div class="face"><img src="himel_face.png" alt=""></div>
   <div class="p-body"></div>
   <div class="p-leg-1"></div><div class="p-leg-2"></div>
 </div>

 <!-- Wife: simple body + ONLY cropped face PNG -->
 <div id="wife" class="character">
   <div class="w-hair"></div>
   <div class="face"><img src="wife_face.png" alt=""></div>
   <div class="w-dress"></div>
   <div class="w-leg-1"></div><div class="w-leg-2"></div>
 </div>

 <button id="jump">JUMP</button>

 <div id="start">
  <div class="panel">
   <h1>হিমেল বনাম বউ</h1>
   <p class="sub">বউ রাগ করেছে! বাধার উপর দিয়ে লাফিয়ে পালিয়ে বাঁচুন!</p>
   <button class="start" onclick="startGame()">খেলুন ▶</button>
  </div>
 </div>

 <div id="over" class="hidden">
  <div class="panel">
   <h1 id="overTitle">গেম ওভার!</h1>
   <p class="sub" id="overSub">বউ আপনাকে ধরে ফেলেছে!</p>
   <button class="start" onclick="startGame()">আবার খেলুন 🔄</button>
  </div>
 </div>
</div>

<script>
let gameRunning=false,score=0,level=1,speed=5.5,isJumping=false,jumpVelocity=0,playerY=0;
const gravity=.45;
let obstacleTimeout=null,animFrame=null,obstacles=[];
const game=document.getElementById('game');
const player=document.getElementById('player');
const wife=document.getElementById('wife');
const jumpBtn=document.getElementById('jump');
const scoreEl=document.getElementById('score');
const levelEl=document.getElementById('level');
const startScreen=document.getElementById('start');
const overScreen=document.getElementById('over');

function doJump(){
 if(!gameRunning||isJumping)return;
 isJumping=true;jumpVelocity=11.5;
}
jumpBtn.addEventListener('touchstart',e=>{e.preventDefault();doJump()});
jumpBtn.addEventListener('mousedown',doJump);
window.addEventListener('keydown',e=>{
 if(e.code==='Space'||e.code==='ArrowUp')doJump();
});

function startGame(){
 const startAudio=document.getElementById('startAudio');
 if(startAudio){
   startAudio.currentTime=0;
   startAudio.play().catch(()=>{});
 }
 gameRunning=true;score=0;level=1;speed=5.5;isJumping=false;playerY=0;
 player.style.transform='translateY(0)';
 scoreEl.innerText=score;levelEl.innerText=level;
 startScreen.classList.add('hidden');overScreen.classList.add('hidden');
 player.classList.add('running');wife.classList.add('running');
 obstacles.forEach(o=>o.el.remove());obstacles=[];
 clearTimeout(obstacleTimeout);cancelAnimationFrame(animFrame);
 spawnObstacle();loop();
}

function spawnObstacle(){
 if(!gameRunning)return;
 const types=['rock','box','barrel','tree'];
 const type=types[Math.floor(Math.random()*types.length)];
 const el=document.createElement('div');
 el.className=`obstacle ${type}`;
 el.style.right='-80px';game.appendChild(el);
 obstacles.push({el:el,pos:-80});
 let nextTime=Math.max(800,Math.random()*(2200-1200)+1200-(level*70));
 obstacleTimeout=setTimeout(spawnObstacle,nextTime);
}

function loop(){
 if(!gameRunning)return;
 if(isJumping){
  playerY+=jumpVelocity;jumpVelocity-=gravity;
  if(playerY<=0){playerY=0;isJumping=false}
  player.style.transform=`translateY(${-playerY}px)`;
 }
 for(let i=obstacles.length-1;i>=0;i--){
  let obs=obstacles[i];obs.pos+=speed;obs.el.style.right=obs.pos+'px';
  let pRect=player.getBoundingClientRect(),oRect=obs.el.getBoundingClientRect();
  if(pRect.right-12>oRect.left&&pRect.left+12<oRect.right&&pRect.bottom-10>oRect.top){
   gameOver();return;
  }
  if(obs.pos>window.innerWidth+80){
   obs.el.remove();obstacles.splice(i,1);score++;scoreEl.innerText=score;
   if(score>=5){score=0;level++;speed+=1.2;scoreEl.innerText=score;levelEl.innerText=level}
  }
 }
 animFrame=requestAnimationFrame(loop);
}

function gameOver(){
 gameRunning=false;player.classList.remove('running');wife.classList.remove('running');
 clearTimeout(obstacleTimeout);cancelAnimationFrame(animFrame);
 document.getElementById('overTitle').innerText='গেম ওভার!';
 document.getElementById('overSub').innerText=`বউ আপনাকে ধরে ফেলেছে! আপনি Level ${level} পর্যন্ত পৌঁছেছেন।`;
 overScreen.classList.remove('hidden');
}
</script>
</body>
</html>
